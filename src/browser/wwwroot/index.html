<!DOCTYPE html>

<html>

<head>
  <title>Gamewright Canvas</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type='module' src="main#[.{fingerprint}].js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101522;
      color: #f2f5fa;
    }

    body {
      max-width: 720px;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    canvas {
      cursor: pointer;
      touch-action: manipulation;
      display: block;
      width: 100%;
      border: 1px solid #52617a;
      border-radius: 0.5rem;
    }

    #error {
      white-space: pre-wrap;
      padding: 0.5rem 1rem;
      border: 1px solid #c0504d;
      border-radius: 0.5rem;
      color: #ffb3b0;
    }

    #stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
      gap: 0.5rem 1rem;
      margin: 1rem 0 0;
      padding: 0.75rem 1rem;
      border: 1px solid #52617a;
      border-radius: 0.5rem;
      font-variant-numeric: tabular-nums;
    }

    #stats dt {
      font-size: 0.75rem;
      color: #9aa8bf;
    }

    #stats dd {
      margin: 0;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>Chess</h1>
    <p>Click one of your pieces, then click any square to move it there. Moves are not checked against the rules of chess.</p>
    <p id="error" role="alert" hidden></p>
    <!-- The width and height only reserve space until the first frame; the host supplies the frame size. -->
    <canvas id="surface" width="640" height="620" aria-label="Chess board. Click a piece, then a destination square."></canvas>
    <dl id="stats" aria-label="Rendering statistics">
      <div><dt>FPS (renders / s)</dt><dd id="stat-fps">0</dd></div>
      <div><dt>Render time (ms)</dt><dd id="stat-render-ms">0</dd></div>
      <div><dt>Frames sent / s</dt><dd id="stat-submits">0</dd></div>
      <div><dt>Transferred / s</dt><dd id="stat-rate">0 B</dd></div>
      <div><dt>Last static frame</dt><dd id="stat-static">0 B</dd></div>
      <div><dt>Last dynamic frame</dt><dd id="stat-dynamic">0 B</dd></div>
      <div><dt>Total transferred</dt><dd id="stat-total">0 B</dd></div>
    </dl>
  </main>
</body>

</html>
